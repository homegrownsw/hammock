body[data-view="preview"] #editor { display: none; }
body[data-view="preview"] #preview, body[data-view="split"] #preview { display: block; }
body[data-view="split"] #preview { box-shadow: inset 1px 0 rgba(128, 128, 128, 0.25); }
.cm-editor { height: 100%; }
.cm-editor.cm-focused { outline: none; }
