<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- Hammock's diff pane. Built by `just editor-js` from apple/Editor: don't edit by hand. -->
<style>
:root {
  --bg: #1e1e1e; --fg: #d4d4d4; --dim: #8a8a8a; --faint: #5a5a5a; --line: #333; --panel: #252525; --hover: #2c2c2c;
  --accent: #61afef; --on-accent: #ffffff; --add: #98c379; --del: #e06c75; --mod: #61afef; --ren: #c678dd; --warn: #e5c07b;
  --ui: -apple-system, system-ui, sans-serif; --code: Menlo, monospace; --code-size: 13px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
  font: 12px/1.4 var(--ui); -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: default; }
input, select { font: inherit; color: var(--fg); background: var(--hover); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
input:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: -1px; }
#app { display: flex; flex-direction: column; height: 100%; }

/* The bar: what's compared, totals, settings. */
#bar { display: flex; align-items: center; gap: 8px; padding: 0 10px; height: 34px; flex: none; border-bottom: 1px solid var(--line); }
#bar .btn, .pop .btn, .fhead .btn { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 7px; border-radius: 6px; white-space: nowrap; }
#bar .btn:hover, .pop .btn:hover, .fhead .btn:hover { background: var(--hover); }
#bar .btn[disabled], .pop .btn[disabled] { opacity: 0.45; }
#source { min-width: 0; font-weight: 600; }
#source .t { overflow: hidden; text-overflow: ellipsis; }
#source .chev { opacity: 0.6; font-weight: normal; }
#totals { color: var(--dim); white-space: nowrap; }
.add { color: var(--add); }
.del { color: var(--del); }
.spacer { flex: 1; }
.icon { width: 15px; height: 15px; display: block; }

/* The diff changed under us: refresh when you're ready. */
#stale { display: none; align-items: center; gap: 10px; padding: 6px 12px; flex: none;
  background: color-mix(in srgb, var(--accent) 12%, var(--bg)); border-bottom: 1px solid var(--line); }
#stale.on { display: flex; }
#stale .btn { height: 22px; padding: 0 10px; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-weight: 600; }

#main { flex: 1; display: flex; min-height: 0; position: relative; }

/* The file tree. */
#tree { width: 260px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; }
#tree.hidden { display: none; }
#tree .head { display: flex; gap: 6px; padding: 8px; flex: none; }
#tree .head input { flex: 1; min-width: 0; }
#tree .list { flex: 1; overflow-y: auto; padding: 0 0 12px; }
.row { display: flex; align-items: center; gap: 5px; height: 24px; padding-right: 10px; white-space: nowrap; border-radius: 5px; margin: 0 6px; }
.row:hover { background: var(--hover); }
.row.active { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.row .name { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.row .n { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
.row.dir .name { color: var(--dim); }
.row .tw { width: 12px; flex: none; text-align: center; color: var(--dim); }
.st { display: inline-block; width: 14px; flex: none; text-align: center; font: 600 10px/14px var(--ui); border-radius: 3px; }
.st.M { color: var(--mod); } .st.A { color: var(--add); } .st.D { color: var(--del); } .st.R, .st.C { color: var(--ren); } .st.T { color: var(--warn); }

/* The files. */
#files { flex: 1; overflow: auto; min-width: 0; padding: 10px 12px 40vh; position: relative; }
.file { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; background: var(--bg); }
.fhead { position: sticky; top: -10px; z-index: 3; display: flex; align-items: center; gap: 6px; min-height: 34px; padding: 4px 8px;
  background: var(--panel); border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; }
/* Closed, the border stays (clear): the file keeps its height to the pixel. */
.file.closed .fhead { border-bottom-color: transparent; border-radius: 8px; }
.file.stuck .fhead { border-radius: 0; }
.fhead .path { font: 12px var(--code); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; -webkit-user-select: text; user-select: text; }
.fhead .path .dir { color: var(--dim); }
.fhead .path .from { color: var(--dim); }
.fhead .counts { white-space: nowrap; font-variant-numeric: tabular-nums; }
.fhead .tag { color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; white-space: nowrap; }
.fhead .twisty { width: 22px; justify-content: center; padding: 0; }
.fhead .twisty svg { transition: transform 0.12s; }
.file.closed .fhead .twisty svg { transform: rotate(-90deg); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex: none; }
.seg button { height: 22px; padding: 0 8px; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--hover); font-weight: 600; }
.fbody { overflow: hidden; border-radius: 0 0 8px 8px; }
.file.closed .fbody { display: none; }
.note { padding: 14px 16px; color: var(--dim); display: flex; align-items: center; gap: 10px; }
.note .btn { color: var(--accent); }
.note .btn:hover { text-decoration: underline; background: none; }
.pics { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
.pics figure { flex: 1; margin: 0; text-align: center; min-width: 0; }
.pics img { max-width: 100%; max-height: 420px; background: repeating-conic-gradient(var(--hover) 0% 25%, transparent 0% 50%) 50% / 16px 16px; border-radius: 4px; }
.pics figcaption { color: var(--dim); margin-top: 6px; }
.pics .gone { border: 1px dashed var(--line); border-radius: 4px; padding: 40px 0; color: var(--faint); }
.loading { color: var(--faint); padding: 12px 16px; }

/* Nothing to show, or something wrong. */
#empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 6px; color: var(--dim); text-align: center; padding: 20px; }
#empty.on { display: flex; }
#empty .big { font-size: 15px; color: var(--fg); font-weight: 600; }

/* Popovers: what to compare, and the settings. */
.pop { position: absolute; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 6px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35); min-width: 240px; max-width: min(460px, calc(100vw - 20px)); display: none; }
.pop.on { display: block; }
.pop h4 { margin: 8px 8px 4px; font-size: 11px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.pop .item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 5px 8px; border-radius: 6px; }
.pop .item:hover { background: var(--hover); }
.pop .item.on::after { content: "✓"; margin-left: auto; color: var(--accent); }
.pop .item .sub { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop .item .sha { font: 11px var(--code); color: var(--dim); flex: none; }
.pop .item .msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.pop .item .when { color: var(--faint); flex: none; font-size: 11px; }
.pop .commits { max-height: 260px; overflow-y: auto; }
.pop .line { display: flex; align-items: center; gap: 6px; padding: 4px 8px; flex-wrap: wrap; }
.pop .line input[type=text] { width: 120px; font-family: var(--code); }
.pop label { display: flex; align-items: center; gap: 6px; }
.pop hr { border: none; border-top: 1px solid var(--line); margin: 6px 0; }
.pop .go { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.pop .go:hover { background: var(--accent); filter: brightness(1.1); }
#scrim { position: absolute; inset: 0; z-index: 19; display: none; }
#scrim.on { display: block; }

/* Review threads and the comment box, under their lines (or above the file). */
.fthreads { padding: 8px 10px 0; display: flex; flex-direction: column; gap: 8px; }
.fthreads:empty { display: none; }
.fthreads > .thread, .fthreads > .composer { margin: 0 0 8px; }
.wwrap { padding: 6px 12px 8px; position: sticky; left: var(--gutw, 0); width: var(--wvis, auto); box-sizing: border-box; }
.wwrap > .thread, .wwrap > .composer { margin: 0; }
.thread, .composer { margin: 6px 12px 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
  font: 13px/1.45 var(--ui); color: var(--fg); -webkit-user-select: text; user-select: text; max-width: 900px; white-space: normal; cursor: auto; }
.thread.st-resolved { opacity: 0.85; }
.thead { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 12px; }
.tlines { font-weight: 600; }
.badge { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 9px; font-size: 11px; font-weight: 600;
  background: var(--hover); color: var(--dim); white-space: nowrap; }
.badge.addressed { background: color-mix(in srgb, var(--add) 22%, transparent); color: var(--fg); }
.badge.resolved { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--fg); }
.badge.outdated { background: color-mix(in srgb, var(--warn) 25%, transparent); color: var(--fg); }
.badge.unsent { background: color-mix(in srgb, var(--warn) 25%, transparent); color: var(--fg); }
.badge.queued { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--fg); }
.badge.new { background: var(--accent); color: var(--on-accent); }
.tfold { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 10px; text-align: left; color: var(--dim); }
.tfold:hover { background: var(--hover); border-radius: 8px; }
.tsum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tcount { font-size: 11px; }
.quote { margin: 8px 10px 0; padding: 6px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  font: 12px/1.4 var(--code); white-space: pre; overflow-x: auto; color: var(--dim); }
.cmt { padding: 8px 10px; }
.cmt + .cmt { border-top: 1px solid var(--line); }
.cmt.unread { box-shadow: inset 3px 0 0 var(--accent); }
.who { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; margin-bottom: 3px; }
.who .name { font-weight: 600; }
.cmt.agent .who .name { color: var(--accent); }
.who .when, .who .sent { color: var(--faint); }
.md p, .md ul, .md ol, .md blockquote, .md pre { margin: 0 0 6px; }
.md > :last-child { margin-bottom: 0; }
.md ul, .md ol { padding-left: 20px; }
.md code { font: 0.92em var(--code); background: var(--hover); padding: 1px 4px; border-radius: 4px; }
.md pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { border-left: 3px solid var(--line); padding-left: 8px; color: var(--dim); }
.md a { color: var(--accent); }
.tact { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); }
.tact.open { flex-direction: column; align-items: stretch; }
.replybox { flex: 1; text-align: left; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--faint); }
.replybox:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.composer { padding: 8px 10px; }
.cfor { font-size: 12px; color: var(--dim); margin-bottom: 6px; font-weight: 600; }
.composer textarea, .tact textarea, .cmt textarea { width: 100%; resize: none; font: 13px/1.45 var(--ui); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 60px; }
.composer textarea:focus, .tact textarea:focus, .cmt textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: -1px; }
.crow { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.crow .btn, .tact .btn, .thead .btn, .who .btn { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
.crow .btn:hover, .tact .btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent) !important; }
.btn.link, .who .btn.link, .thread > .btn.link { border: none; background: none; padding: 0 2px; height: auto; color: var(--accent); }
.thread > .btn.link { margin: 6px 10px 0; font-size: 12px; }
.btn.link:hover { text-decoration: underline; }
.btn.link.danger { color: var(--del); }
.sendto { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
#bar .btn.send { background: var(--accent); color: var(--on-accent); font-weight: 600; }
#bar .btn.send:hover { filter: brightness(1.08); background: var(--accent); }
#target { max-width: 220px; }
#target .t { overflow: hidden; text-overflow: ellipsis; }
#target .chev { opacity: 0.6; }
.fhead .ccount { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px; background: color-mix(in srgb, var(--accent) 22%, transparent); font-size: 11px; font-weight: 600; }
.row .cn { color: var(--accent); font-weight: 600; }
/* Line numbers take a comment: a + on hover; a range being commented on. */
.fbody .cm-lineNumbers .cm-gutterElement { cursor: pointer; position: relative; }
.fbody .cm-lineNumbers .cm-gutterElement:hover { color: transparent; }
.fbody .cm-lineNumbers .cm-gutterElement:hover::before { content: "+"; position: absolute; inset: 1px 3px; border-radius: 4px; background: var(--accent);
  color: var(--on-accent); font: 600 13px/1 var(--ui); display: flex; align-items: center; justify-content: center; }
.fbody .cm-commentRange { background: color-mix(in srgb, var(--accent) 14%, transparent) !important; }

/* The code can be selected and copied (the page's own controls can't). */
.fbody .cm-content, .fbody .cm-deletedChunk, .fbody .cm-deletedLine { -webkit-user-select: text; user-select: text; }
.fbody .cm-gutters { -webkit-user-select: none; user-select: none; }
.fbody .cm-cursorLayer, .fbody .cm-cursor { display: none !important; }
.fbody .cm-content { caret-color: transparent; }

/* CodeMirror in a file: as tall as it needs, the files scroll. */
.fbody .cm-editor { height: auto !important; }
.fbody .cm-editor.cm-focused { outline: none; }
.fbody .cm-mergeView { overflow: visible; }

/* Narrow (an iPhone, a thin split): the tree floats over the files. */
@media (max-width: 640px) {
  #tree { position: absolute; z-index: 10; top: 0; bottom: 0; left: 0; background: var(--bg); box-shadow: 4px 0 20px rgba(0, 0, 0, 0.3); width: min(300px, 85vw); }
  #totals .files { display: none; }
  #files { padding: 8px 6px 40vh; }
  .fhead .seg { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <div id="bar"></div>
  <div id="stale"><span class="t">The changes have moved on since this was shown.</span><span class="spacer"></span><button class="btn" id="refresh">Refresh</button></div>
  <div id="main">
    <nav id="tree"><div class="head"><input id="filter" type="search" placeholder="Filter files" autocomplete="off" spellcheck="false"></div><div class="list"></div></nav>
    <div id="files"></div>
    <div id="empty"></div>
  </div>
</div>
<div id="scrim"></div>
<div class="pop" id="sourcePop"></div>
<div class="pop" id="settingsPop"></div>
<div class="pop" id="targetPop"></div>
<script>
/*SCRIPT*/
</script>
</body>
</html>
