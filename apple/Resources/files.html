<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- Hammock's files pane. Built by `just editor-js` from apple/Editor: don't edit by hand. -->
<style>
:root {
  --bg: #1e1e1e; --fg: #d4d4d4; --dim: #8a8a8a; --faint: #5a5a5a; --line: #333; --hover: #2c2c2c;
  --accent: #61afef; --on-accent: #ffffff; --add: #98c379; --del: #e06c75; --mod: #e5c07b; --ren: #c678dd; --warn: #e06c75;
  --ui: -apple-system, system-ui, sans-serif; --row: 22px; --indent: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
  font: 13px/1.4 var(--ui); -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none; }
body.touch { --row: 34px; --indent: 16px; font-size: 15px; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: default; }
input { font: inherit; color: var(--fg); background: var(--hover); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; }
input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: -1px; }
#app { display: flex; flex-direction: column; height: 100%; }

/* The bar: where you are, and the pane's switches. */
#bar { display: flex; align-items: center; gap: 2px; padding: 0 6px; height: 30px; flex: none; border-bottom: 1px solid var(--line); }
body.touch #bar { height: 42px; gap: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 22px; min-width: 22px; padding: 0 4px; border-radius: 5px; color: var(--dim); flex: none; }
body.touch .btn { height: 34px; min-width: 34px; }
.btn:hover { background: var(--hover); color: var(--fg); }
.btn.on { color: var(--accent); }
.btn[disabled] { opacity: 0.35; }
.btn svg { width: 15px; height: 15px; display: block; }
body.touch .btn svg { width: 19px; height: 19px; }
/* Too long, it loses its start, not the folder you're in. */
#crumbs { flex: 1; min-width: 0; display: block; overflow: hidden; direction: rtl; text-align: left; white-space: nowrap; }
#crumbs .inner { direction: ltr; display: inline-flex; align-items: center; }
.crumb { padding: 1px 4px; border-radius: 4px; color: var(--dim); }
.crumb:last-child { color: var(--fg); font-weight: 600; }
.crumb:hover { background: var(--hover); color: var(--fg); }
.sep { color: var(--faint); padding: 0 1px; }

#filterbar { display: none; padding: 5px 8px; border-bottom: 1px solid var(--line); flex: none; gap: 6px; align-items: center; }
#filterbar.on { display: flex; }
#filter { flex: 1; min-width: 0; }
#filtercount { color: var(--dim); font-size: 11px; white-space: nowrap; }

#note { display: none; padding: 16px; color: var(--dim); text-align: center; }
#note.on { display: block; }

/* The tree: only the rows on screen are in the page. */
#list { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; outline: none; }
#list:focus-visible { outline: none; }
#sizer { position: relative; width: 100%; }
.row { position: absolute; left: 0; right: 0; height: var(--row); display: flex; align-items: center; gap: 5px; padding-right: 10px; white-space: nowrap; }
.row:hover { background: var(--hover); }
.row.sel { background: color-mix(in srgb, var(--fg) 12%, transparent); }
#list:focus .row.sel, #list.focused .row.sel { background: color-mix(in srgb, var(--accent) 32%, transparent); }
.row.cursor::before { content: ""; position: absolute; inset: 0; border: 1px solid color-mix(in srgb, var(--accent) 70%, transparent); border-radius: 2px; pointer-events: none; display: none; }
#list:focus .row.cursor:not(.sel)::before { display: block; }
.row.drop { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.row .tw { width: 14px; height: 14px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--dim); }
.row .tw svg { width: 10px; height: 10px; transition: transform 0.1s; }
.row.open .tw svg { transform: rotate(90deg); }
.row .ic { width: 16px; height: 16px; flex: none; display: flex; align-items: center; justify-content: center; }
.row .ic svg { width: 15px; height: 15px; }
.row .name { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.row .name mark { background: none; color: var(--accent); font-weight: 700; }
.row .badge { font: 600 10px/14px var(--ui); width: 14px; text-align: center; flex: none; }
.row .link { color: var(--dim); font-size: 11px; }
.row.ignored .name, .row.ignored .ic { opacity: 0.45; }
.row.hidden .name { opacity: 0.7; }
.row.loading .name { color: var(--dim); font-style: italic; }
.row.error .name { color: var(--del); }
.g-M .name, .g-M .badge { color: var(--mod); }
.g-A .name, .g-A .badge, .g-U .name, .g-U .badge { color: var(--add); }
.g-D .name, .g-D .badge { color: var(--del); }
.g-R .name, .g-R .badge { color: var(--ren); }
.g-C .name, .g-C .badge { color: var(--warn); }
.row.dir .badge { font-size: 0; }
.row.dir .badge::after { content: "●"; font-size: 7px; vertical-align: middle; }
.row.dir:not([class*="g-"]) .badge::after { content: none; }
.row input.rename { flex: 1; min-width: 0; height: calc(var(--row) - 4px); padding: 0 4px; font: inherit; }
.indent { flex: none; height: 100%; }

#drag { position: fixed; pointer-events: none; padding: 2px 8px; border-radius: 5px; background: var(--accent); color: var(--on-accent); font-weight: 600; display: none; z-index: 10; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button class="btn" id="up" title="Enclosing Folder"></button>
    <div id="crumbs"><span class="inner"></span></div>
    <button class="btn" id="home" title="Back to the Group's Folder"></button>
    <button class="btn" id="find" title="Filter"></button>
    <button class="btn" id="hidden" title="Show Hidden Files"></button>
    <button class="btn" id="collapse" title="Collapse Folders"></button>
  </div>
  <div id="filterbar"><input id="filter" placeholder="Filter" spellcheck="false" autocomplete="off" autocapitalize="off"><span id="filtercount"></span></div>
  <div id="note"></div>
  <div id="list" tabindex="0"><div id="sizer"></div></div>
  <div id="drag"></div>
</div>
