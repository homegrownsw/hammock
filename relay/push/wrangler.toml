name = "hmk-push"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Served at push.homegrownsw.com (homegrownsw.com's DNS is on Cloudflare; the deploy makes the record), and
# still at hmk-push.homegrownsw.workers.dev, where iPhone builds up to iOS-v2026.6.0 (r1398) register.
# Both are the same Worker and database, so a phone's relay id works at either. Macs send to the domain
# whichever a phone names (relayMoved in internal/daemon/push.go), and iPhone builds after iOS-v2026.6.0
# use the domain. The WAF rule (README) only covers the domain, so once the next iPhone release is out and
# installed, set workers_dev = false and deploy.
workers_dev = true
routes = [{ pattern = "push.homegrownsw.com", custom_domain = true }]

[vars]
APNS_TOPIC = "com.homegrownsw.hammock"

# The Homegrown Software account's (wrangler d1 create hmk-push).
[[d1_databases]]
binding = "DB"
database_name = "hmk-push"
database_id = "6dd2eddd-cf18-41d0-908a-9218051c333b"

# 60 sends a minute per phone.
[[ratelimits]]
name = "SENDS"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# 10 registrations a minute per client IP.
[[ratelimits]]
name = "REGISTERS"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# 200 requests a minute per client address (an IPv6 /64), before anything else.
[[ratelimits]]
name = "REQUESTS"
namespace_id = "1003"
simple = { limit = 200, period = 60 }

# Daily: forget devices nothing has sent to for 60 days.
[triggers]
crons = ["23 4 * * *"]
