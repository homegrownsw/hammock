# Go tests, vet and the benchmark gate on macOS (the daemon's home platform),
# plus a build of the Swift clients. GitHub's runners are free for public repos;
# Actions are switched on for the repo once it's public.
name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    # The Xcode 27 image (standard arm64, free for public repos; macos-26 has no Xcode 27).
    # Not xcode-27-xlarge: larger runners are billed even on public repos.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The apps need Xcode 27.2 or later (the project's JSON format, Swift 6).
      - name: Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_27.*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode" && xcodebuild -version
      - name: Tools
        run: brew install just zig
      # libghostty-vt, built once per pinned Ghostty commit (scripts/ghostty-deps.sh).
      - name: Cache libghostty-vt
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/hammock/ghostty
          key: ghostty-${{ hashFiles('third_party/ghostty/VERSION') }}
      - name: Vet and test
        run: |
          just deps
          export PKG_CONFIG_PATH=$PWD/third_party/ghostty/out/share/pkgconfig
          just vet test
      # The race detector on the pane holder (quick, and what panes' input and proofs run through). The
      # daemon's whole suite under -race takes too long to run on every push.
      - name: Race (holder)
        run: |
          export PKG_CONFIG_PATH=$PWD/third_party/ghostty/out/share/pkgconfig
          just race ./internal/holder/
      - name: Benchmark gate
        run: |
          export PKG_CONFIG_PATH=$PWD/third_party/ghostty/out/share/pkgconfig
          just bench-gate
      - name: Swift build
        run: |
          just apple-deps
          cd apple && swift build

  android:
    # The Android app: libghostty-vt and libhmkquic (Go: its QUIC video) for Android, the app's build, its
    # JVM tests and lint. Linux, where the runners already have the Android SDK.
    runs-on: ubuntu-latest
    env:
      HMK_GHOSTTY_CACHE: ${{ github.workspace }}/../ghostty-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" >/dev/null
      - name: Cache libghostty-vt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../ghostty-cache
          key: ghostty-android-${{ hashFiles('third_party/ghostty/VERSION') }}
      - name: libghostty-vt for Android
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006" ./scripts/android-vt.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        working-directory: android
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006" ./gradlew :app:assembleDebug :client:test testDebugUnitTest lintDebug
