<!doctype html>
<!-- The README's banner. Render it to banner.png with the command in README.md (this folder). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hammock banner</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .banner {
    position: relative; overflow: hidden;
    width: 1280px; height: 400px; border-radius: 28px;
    background:
      radial-gradient(700px 420px at 18% 30%, rgba(46, 138, 98, 0.55), transparent 70%),
      radial-gradient(600px 400px at 95% 110%, rgba(10, 132, 255, 0.12), transparent 70%),
      linear-gradient(160deg, #0b2a1d, #06140e 70%);
    display: flex; align-items: center; gap: 56px; padding: 0 84px; box-sizing: border-box;
    font-family: Inter, system-ui, sans-serif; color: #eaf6ef;
  }
  .banner::after { content: ""; position: absolute; inset: auto 0 0 0; height: 5px;
    background: linear-gradient(90deg, #61d836, #ffd60a, #ff9f0a, #ff453a, #bf5af2, #0a84ff); }
  .ghost { position: absolute; right: -60px; top: 10px; width: 640px; opacity: .10; filter: blur(1px); }
  img.icon { width: 240px; height: 240px; flex: none; filter: drop-shadow(0 24px 50px rgba(0,0,0,.55)); position: relative; }
  .text { position: relative; }
  h1 { font: 700 112px/1 "Space Grotesk", sans-serif; letter-spacing: -0.045em; margin: 0 0 18px; }
  h1 span { background: linear-gradient(90deg, #61d836, #ffd60a, #ff9f0a, #ff453a, #bf5af2, #0a84ff);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { font-size: 29px; line-height: 1.35; color: #b6d3c4; margin: 0; max-width: 720px; }
  p b { color: #eaf6ef; font-weight: 500; }
</style>
</head>
<body>
<div class="banner">
  <svg class="ghost" viewBox="2.2 7.7 19.6 8.7" aria-hidden="true">
    <defs><linearGradient id="g" x1="2.5" y1="0" x2="21.5" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#61d836"/><stop offset=".2" stop-color="#ffd60a"/><stop offset=".4" stop-color="#ff9f0a"/><stop offset=".6" stop-color="#ff453a"/><stop offset=".8" stop-color="#bf5af2"/><stop offset="1" stop-color="#0a84ff"/></linearGradient></defs>
    <path d="M2.5 13.2 C5 7.8 9 8.4 12 11 C15 13.6 18.4 14 21.5 9.6 C19 16 14.8 16.2 11.6 13.6 C8.6 11.2 5.4 10.8 2.5 13.2 Z" fill="url(#g)" stroke="url(#g)" stroke-width=".6" stroke-linejoin="round"/>
  </svg>
  <img class="icon" src="../apple/Resources/AppIcon-1024.png" alt="">
  <div class="text">
    <h1>Hammock</h1>
    <p>Terminals, coding agents, browsers and simulators, <b>always on</b>. Kick back: it tells you when you’re needed.</p>
  </div>
</div>
</body>
</html>
