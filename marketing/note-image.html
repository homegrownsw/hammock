<!doctype html>
<!-- A release note's picture, framed: a screenshot on the site's green with a title and a line about it.
     scripts/note-image renders it to a PNG (release-notes/README.md); open it with ?img=…&title=…&text=… to
     look at it in a browser. The title and line sit beside the screenshot, or above one more than twice as
     wide as it's tall (layout=side or layout=stacked to choose). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hammock note image</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #06140e; }
  /* 16:10, so it sits the same in Sparkle's window, the GitHub Release and the docs. */
  .frame {
    position: relative; overflow: hidden; box-sizing: border-box; width: 1600px; height: 1000px;
    display: grid; grid-template-columns: 520px minmax(0, 1fr); gap: 64px; align-items: center; padding: 72px 72px 78px 104px;
    background: #06140e; font-family: Inter, system-ui, sans-serif; color: #eaf6ef;
  }
  .frame.stacked { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; align-content: center; gap: 52px; padding: 64px 100px 70px; text-align: center; }
  .stacked .shot { height: auto; }
  .stacked .shot img { max-height: 600px; }
  /* The backdrop: the app's spectrum as soft light on the green, a faint dot grid, and a glow behind the shot. */
  .bg { position: absolute; inset: 0; pointer-events: none; }
  .bg i { position: absolute; border-radius: 50%; filter: blur(110px); }
  .bg .g { width: 900px; height: 700px; left: -260px; top: -280px; background: #2e8a62; opacity: .75; }
  .bg .y { width: 420px; height: 360px; left: 260px; top: 640px; background: #ffd60a; opacity: .16; }
  .bg .o { width: 460px; height: 380px; left: -140px; top: 560px; background: #ff9f0a; opacity: .18; }
  .bg .p { width: 640px; height: 560px; right: -120px; top: -220px; background: #bf5af2; opacity: .26; }
  .bg .b { width: 760px; height: 600px; right: -200px; bottom: -300px; background: #0a84ff; opacity: .30; }
  .bg .dots { position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.16) 1.4px, transparent 1.6px); background-size: 28px 28px;
    -webkit-mask-image: radial-gradient(1100px 700px at 30% 40%, #000, transparent 75%); mask-image: radial-gradient(1100px 700px at 30% 40%, #000, transparent 75%); }
  .frame::after { content: ""; position: absolute; inset: auto 0 0 0; height: 6px;
    background: linear-gradient(90deg, #61d836, #ffd60a, #ff9f0a, #ff453a, #bf5af2, #0a84ff); }
  .words { position: relative; }
  h1 { margin: 0; font: 700 84px/1.02 "Space Grotesk", sans-serif; letter-spacing: -0.045em; text-wrap: balance; }
  h1::after { content: ""; display: block; width: 96px; height: 5px; margin-top: 28px; border-radius: 3px;
    background: linear-gradient(90deg, #61d836, #ffd60a, #ff9f0a, #ff453a, #bf5af2, #0a84ff); }
  .stacked h1 { font-size: 76px; }
  .stacked h1::after { display: none; }
  p { margin: 26px 0 0; font-size: 31px; line-height: 1.42; color: #c3dccf; text-wrap: pretty; }
  .stacked p { margin: 18px auto 0; max-width: 1100px; font-size: 29px; text-wrap: balance; }
  /* The screenshot, whole, its own shape (a window's rounded corners stay rounded). */
  .shot { position: relative; min-width: 0; min-height: 0; height: 100%; display: flex; align-items: center; justify-content: center; }
  .shot::before { content: ""; position: absolute; inset: 12% 10%; border-radius: 50%; background: rgba(61, 255, 162, .22); filter: blur(80px); }
  .shot img { position: relative; max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 14px;
    filter: drop-shadow(0 34px 60px rgba(0,0,0,.6)) drop-shadow(0 0 1px rgba(255,255,255,.3)); }
</style>
</head>
<body>
<div class="frame">
  <div class="bg"><i class="g"></i><i class="o"></i><i class="y"></i><i class="p"></i><i class="b"></i><div class="dots"></div></div>
  <div class="words">
    <h1 id="title">Automations</h1>
    <p id="text">Run an agent or a command on a schedule, or the moment something happens.</p>
  </div>
  <div class="shot"><img id="img" alt=""></div>
</div>
<script>
  const q = new URLSearchParams(location.search), frame = document.querySelector('.frame'), img = document.getElementById('img');
  for (const k of ['title', 'text']) if (q.has(k)) document.getElementById(k).textContent = q.get(k);
  if (q.has('title') && !q.get('text')) document.getElementById('text').remove();
  const layout = q.get('layout') || 'auto';
  if (layout === 'stacked') frame.classList.add('stacked');
  img.onload = () => { if (layout === 'auto' && img.naturalWidth > 2 * img.naturalHeight) frame.classList.add('stacked'); };
  if (q.has('img')) img.src = q.get('img');
</script>
</body>
</html>
