<!doctype html>
<!-- The DMG window's background (Hammock.dmg, scripts/make-dmg.sh). Render it to
     apple/Resources/dmg-background.png and @2x with the commands in README.md (this folder).
     Finder draws the icons and their names over it: Hammock.app centred at (165, 204) and Applications at
     (495, 204), 128 pt, names in 14 pt (scripts/dmg-settings.py). Over a background picture Finder draws the
     window as Light whatever the Mac's appearance, so the names are always black: the mint pills under
     them are what keeps them readable on the dark green. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hammock DMG background</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  .bg {
    position: relative; overflow: hidden; width: 660px; height: 400px; color: #eaf6ef;
    background:
      radial-gradient(520px 320px at 50% -80px, rgba(46, 138, 98, 0.6), transparent 70%),
      radial-gradient(420px 300px at 105% 115%, rgba(10, 132, 255, 0.12), transparent 70%),
      radial-gradient(380px 280px at -5% 110%, rgba(191, 90, 242, 0.08), transparent 70%),
      #06140e;
  }
  .head { position: absolute; top: 34px; left: 0; right: 0; text-align: center; }
  h1 { margin: 0; font: 700 36px/1 "Space Grotesk", sans-serif; letter-spacing: -0.04em; }
  h1 span { background: linear-gradient(90deg, #61d836, #ffd60a, #ff9f0a, #ff453a, #bf5af2, #0a84ff);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 10px 0 0; font: 400 14px Inter, sans-serif; color: #a3c2b2; }
  svg { position: absolute; left: 0; top: 0; }
  /* Under each icon's name. */
  .pill { position: absolute; top: 274.5px; width: 124px; height: 26.5px; border-radius: 13.25px;
    background: #3dffa2; box-shadow: 0 0 30px rgba(61, 255, 162, 0.28); }
  .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
    background: linear-gradient(90deg, #61d836, #ffd60a, #ff9f0a, #ff453a, #bf5af2, #0a84ff); }
</style>
</head>
<body>
<div class="bg">
  <div class="head">
    <h1>Kick <span>back.</span></h1>
    <p>Drag Hammock into Applications.</p>
  </div>
  <svg width="660" height="400" viewBox="0 0 660 400" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="244" y1="0" x2="416" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#61d836"/><stop offset=".2" stop-color="#ffd60a"/><stop offset=".4" stop-color="#ff9f0a"/>
        <stop offset=".6" stop-color="#ff453a"/><stop offset=".8" stop-color="#bf5af2"/><stop offset="1" stop-color="#0a84ff"/>
      </linearGradient>
    </defs>
    <path d="M244 188 C282 138 378 138 416 188" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>
    <path d="M400.8 183.1 L416 188 L415.4 172" fill="none" stroke="#0a84ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="pill" style="left: 103px"></div>
  <div class="pill" style="left: 433px"></div>
  <div class="stripe"></div>
</div>
</body>
</html>
